# Oyunu GitHub Pages üzerinde yayınlar (derleme adımı yok — statik dosyalar).
# Tek seferlik ayar (depo sahibi): Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Pages açık değilse iş akışı hata vermeden atlanır; açıldıktan sonra her push'ta otomatik yayınlanır.
name: GitHub Pages

on:
  push:
    branches: [main, master, 'claude/hopeful-cray-o1jw6w']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::notice::GitHub Pages bu depoda henüz açık değil (Settings → Pages → Source: GitHub Actions). Yayın atlandı."; fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # tek dosyalık çevrimdışı sürüm (indirilip çift tıklanarak oynanır)
      - name: Tek dosya HTML sürümü
        run: |
          npm i --prefix "$RUNNER_TEMP/esb" --no-audit --no-fund esbuild@0.24.2
          NODE_PATH="$RUNNER_TEMP/esb/node_modules" node tools/build-single-html.mjs DenizKorsanlari-SonHazine.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
