<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Deniz Korsanları: Son Hazine</title>
  <meta name="description" content="Açık dünya 3D korsan macerası — keşif, hazine avı, balıkçılık, gemi savaşları ve online co-op.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
  <script>
  // A-04: açılış hata yakalayıcısı. Klasik betik (ES5): oyun modülü hiç yüklenemese ya da tarayıcı import map desteklemese de çalışır.
  // window.__ready gelene dek yakalanmamış hata, oyun modülünün yüklenememesi, import map desteğinin olmaması ve uzun süren yükleme
  // yükleme ekranında (#load-text) anlaşılır bir iletiyle gösterilir. Açılış bittikten sonra hiçbir şey yapmaz.
  (function () {
    var TEK = 'tek dosya sürümünü (DenizKorsanlari-SonHazine.html)';
    var bitti = function () { return !!window.__ready; };
    var yaz = function (ileti, oneri, kalici) {
      var t = document.getElementById('load-text');
      if (!t) { document.addEventListener('DOMContentLoaded', function () { yaz(ileti, oneri, kalici); }); return; }
      if (bitti() || (window.__dkAcilisHatasi && !kalici)) return;
      if (kalici) window.__dkAcilisHatasi = true;
      t.textContent = ileti;
      if (oneri) { t.appendChild(document.createElement('br')); var s = document.createElement('small'); s.textContent = oneri; t.appendChild(s); }
    };
    var metin = function (x) { try { return String((x && (x.message || x)) || 'bilinmeyen hata').slice(0, 200); } catch (e) { return 'bilinmeyen hata'; } };
    var modulHatasi = function (m) { return /import|module|specifier|modül/i.test(m); };
    // import map desteği (HTMLScriptElement.supports yoksa karar verilemez; o zaman modül çözümleme hatası aşağıda yakalanır).
    // Tek dosya derlemesinde import map kaldırılır, denetim de atlanır.
    try {
      if (document.querySelector('script[type="importmap"]') && typeof HTMLScriptElement !== 'undefined' && typeof HTMLScriptElement.supports === 'function' && !HTMLScriptElement.supports('importmap')) {
        yaz('Tarayıcın modül eşlemesini (import map) desteklemiyor; oyun bu adresten açılamıyor.', 'Tarayıcını güncelle (Chrome/Edge 89+, Firefox 108+, Safari 16.4+) ya da ' + TEK + ' indirip aç.', true);
      }
    } catch (e) { /* denetlenemedi */ }
    window.addEventListener('error', function (e) {
      if (bitti()) return;
      var el = e && e.target;
      if (el && el !== window && el.tagName) {
        // kaynak hatası (yakalama evresinde görülür): yalnız oyunun modül betiği açılışı durdurur
        if (el.tagName === 'SCRIPT' && (el.type === 'module' || /js\/main\.js/.test(el.src || ''))) {
          yaz('Oyun dosyaları yüklenemedi: bir modül indirilemedi ya da bulunamadı (' + (el.getAttribute('src') || 'modül') + ').', 'Bağlantını denetleyip sayfayı yenile; sorun sürerse ' + TEK + ' kullan.', true);
        }
        return;
      }
      var m = metin(e && (e.error || e.message));
      if (modulHatasi(m)) yaz('Oyun dosyaları yüklenemedi: modül çözümlenemedi (' + m + ').', 'Tarayıcını güncelle ya da ' + TEK + ' kullan.', true);
      else yaz('Açılışta bir hata oluştu: ' + m, 'Sayfayı yenile; sorun sürerse ' + TEK + ' dene.');
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      if (bitti()) return;
      var m = metin(e && e.reason);
      if (modulHatasi(m)) yaz('Oyun dosyaları yüklenemedi: modül yüklenemedi (' + m + ').', 'Bağlantını denetleyip sayfayı yenile; sorun sürerse ' + TEK + ' kullan.', true);
      else yaz('Açılışta bir hata oluştu: ' + m, 'Sayfayı yenile; sorun sürerse ' + TEK + ' dene.');
    });
    // 30 sn içinde açılış bitmezse uyarı (yükleme metni ilerledikçe yeniden eklenir)
    var uyar = function () {
      if (bitti() || window.__dkAcilisHatasi) return;
      var t = document.getElementById('load-text');
      if (!t || t.querySelector('.yavas-uyari')) return;
      var s = document.createElement('small'); s.className = 'yavas-uyari';
      s.textContent = 'Yükleme beklenenden uzun sürüyor (30 sn+). İnternet bağlantını denetle; ilerlemezse sayfayı yenile ya da ' + TEK + ' kullan.';
      t.appendChild(document.createElement('br')); t.appendChild(s);
    };
    setTimeout(function () { uyar(); var iv = setInterval(function () { if (bitti()) clearInterval(iv); else uyar(); }, 5000); }, 30000);
  })();
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="underwater-tint"></div>
  <div id="vignette"></div>

  <!-- Yükleme ekranı -->
  <section id="loading" class="screen active">
    <div class="loading-inner">
      <div class="logo big"><span class="logo-top">DENİZ KORSANLARI</span><span class="logo-bottom">SON HAZİNE</span></div>
      <div class="compass-spin"></div>
      <div class="load-bar"><div class="load-fill" id="load-fill"></div></div>
      <div id="load-text">Rüzgâr bekleniyor…</div>
      <div class="load-tip" id="load-tip"></div>
    </div>
  </section>

  <!-- Ana menü -->
  <section id="menu" class="screen">
    <div class="menu-side">
      <div class="logo"><span class="logo-top">DENİZ KORSANLARI</span><span class="logo-bottom">SON HAZİNE</span><span class="logo-sub">PIRATES: THE LAST TREASURE</span></div>
      <div id="menu-card"></div>
      <nav class="menu-buttons" id="menu-buttons"></nav>
      <div class="menu-foot" id="menu-foot"></div>
    </div>
    <aside class="menu-news" id="menu-news"></aside>
  </section>

  <!-- Genel modal katmanı (menü alt ekranları ve oyun içi paneller) -->
  <section id="modal" class="screen"></section>

  <!-- HUD -->
  <section id="hud" class="hidden">
    <div id="compass-bar"><div id="compass-strip"></div><div id="compass-needle"></div></div>
    <div id="boss-bar" class="hidden"><div class="boss-name"></div><div class="boss-track"><div class="boss-fill"></div></div></div>
    <div id="time-panel">
      <div class="tp-top"><span class="tp-day"></span><span class="tp-clock"></span><span class="tp-weather"></span><span class="tp-tide"></span></div>
      <div class="tp-strip"><div class="tp-bg"></div><div class="tp-bands"></div><div class="tp-ticks"></div><div class="tp-icons"></div><div class="tp-now"></div></div>
      <div class="tp-next"></div>
    </div>
    <div id="quest-tracker"></div>
    <div id="notify-stack"></div>
    <div id="vitals">
      <div class="vital hp"><span class="vital-icon">❤</span><div class="track"><div class="fill"></div></div></div>
      <div class="vital st"><span class="vital-icon">⚡</span><div class="track"><div class="fill"></div></div></div>
      <div class="vital ox hidden"><span class="vital-icon">◯</span><div class="track"><div class="fill"></div></div><span class="depth"></span></div>
      <div class="xp-line" id="hud-xpline"><span class="rank-badge" id="hud-lvl">1</span><div class="xp-col"><div class="xp-rank" id="hud-rank">Miço</div><div class="xp-track"><div class="xp-fill" id="hud-xp"></div></div></div><span class="xp-pts hidden" id="hud-pts">K</span></div>
      <div class="gold-line"><span class="coin"></span><span id="hud-gold">0</span><span id="hud-bag" title="Çanta yükü (Tab: envanter)"></span></div>
      <div id="xp-pops"></div>
    </div>
    <div id="levelup" class="hidden"><div class="lu-top">RÜTBE ATLADIN</div><div class="lu-level"></div><div class="lu-rank"></div><div class="lu-hint">Yeni yetenek puanı — <span class="kbd">K</span> ile Korsan Rütbesi</div></div>
    <div id="loc-banner" class="hidden"><div class="lb-line"></div><div class="lb-title"></div><div class="lb-sub"></div></div>
    <div id="hotbar"></div>
    <div id="ship-panel" class="hidden"></div>
    <div id="minimap"><canvas id="mm-canvas" width="200" height="200"></canvas><div class="mm-n">K</div></div>
    <div id="prompt" class="hidden"><kbd></kbd><span class="label"></span><div class="sub"></div><div class="hold-ring"></div></div>
    <div id="crosshair" class="hidden"></div>
    <div id="hitmarker"></div>
    <div id="fishing-hud" class="hidden"></div>
    <div id="busy-bar" class="hidden"><div class="busy-label"></div><div class="track"><div class="fill"></div></div></div>
    <div id="team-list"></div>
    <div id="hud-info"></div>
    <div id="chat-box" class="hidden"><div id="chat-log"></div><input id="chat-input" maxlength="140" placeholder="Mesaj yaz, Enter ile gönder"></div>
    <div id="damage-flash"></div>
    <div id="spyglass" class="hidden"><div class="sg-ring"></div><div class="sg-cross"></div><div class="sg-target"></div><div class="sg-help"></div></div>
  </section>

  <div id="tooltip" class="hidden"></div>
  <noscript>Bu oyun JavaScript gerektirir.</noscript>
  <script src="vendor/peerjs/peerjs.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
